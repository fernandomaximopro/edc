<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDC: Games &amp; Apps — Portfólio de projetos</title>
<meta name="description" content="Jogos e aplicativos criados por alunos na disciplina de Educação Digital e Computação.">
<meta property="og:title" content="EDC: Games & Apps">
<meta property="og:description" content="Jogos e aplicativos criados por alunos na disciplina de Educação Digital e Computação.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/styles.css">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

<header class="site-nav">
  <div class="wrap nav-inner">
    <a class="brand" href="/">
      <span class="brand-mark font-display">EDC</span>
      <span class="brand-text font-display">Games &amp; Apps</span>
    </a>
    <nav class="nav-links">
      <a href="/catalogo.html">Projetos</a>
      <input class="nav-search" id="busca-topo" type="search" placeholder="Buscar…">
    </nav>
  </div>
</header>

<section class="hero wrap">
  <p class="eyebrow font-mono" id="hero-eyebrow"></p>
  <h1 class="font-display" id="hero-titulo"></h1>
  <div class="subtitulo" id="hero-subtitulo"></div>
</section>

<section class="secao wrap" id="secao-fotos" hidden>
  <h2 class="secao-titulo font-display" id="titulo-fotos"></h2>
  <div class="fita" id="fita-fotos"></div>
</section>

<section class="secao wrap" id="secao-acessados" hidden>
  <h2 class="secao-titulo font-display">🔥&nbsp;<span id="titulo-acessados"></span></h2>
  <div class="app-fita" id="fita-acessados"></div>
</section>

<section class="secao wrap" id="secao-lancamentos" hidden>
  <h2 class="secao-titulo font-display" id="titulo-lancamentos"></h2>
  <div class="app-fita" id="fita-lancamentos"></div>
</section>

<section class="wrap">
  <div class="cta-catalogo">
    <div>
      <h3 class="font-display">Ver o catálogo completo</h3>
      <p id="cta-texto">Explore todos os projetos, com filtros por ano, segmento e categoria.</p>
    </div>
    <a class="btn-primario" href="/catalogo.html">Ver todos os projetos →</a>
  </div>
</section>

<footer class="rodape wrap">
  <span>EDC: Games &amp; Apps — portfólio de turma</span>
  <a href="/admin/">Área do professor</a>
</footer>

<template id="tpl-app-card">
  <a class="app-card">
    <div class="app-icone">
      <img loading="lazy" alt="">
      <span class="app-badge font-mono" hidden></span>
    </div>
    <p class="app-titulo"></p>
    <div class="app-tags-mini">
      <p class="app-tag"></p>
      <span class="app-chip"></span>
    </div>
    <p class="app-aviso" hidden>⚠ link pode estar indisponível</p>
  </a>
</template>

<script src="/assets/site.js"></script>
<script>
async function iniciar(){
  const { projetos, config, cliques, status } = await carregarDados();
  aplicarTema(config.tema);

  setTexto('hero-eyebrow', config.heroEyebrow);
  setTexto('hero-titulo', config.heroTitulo || 'Projetos da turma');
  montarSubtitulo(config.heroSubtitulo);
  setTexto('titulo-fotos', config.tituloCarrosselFotos || 'Bastidores da turma');
  setTexto('titulo-acessados', config.tituloMaisAcessados || 'Mais acessados');
  setTexto('titulo-lancamentos', config.tituloLancamentos || 'Lançamentos recentes');

  if (projetos.length){
    document.getElementById('cta-texto').textContent =
      `Explore os ${projetos.length} projetos publicados até agora, com filtros por ano, segmento e categoria.`;
  }

  montarFotos(config.carrosselFotos);
  montarMaisAcessados(projetos, cliques, status);
  montarLancamentos(projetos, status);

  document.getElementById('busca-topo').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.value.trim()){
      window.location.href = `/catalogo.html?busca=${encodeURIComponent(e.target.value.trim())}`;
    }
  });
}

function setTexto(id, valor){
  const el = document.getElementById(id);
  if (!valor){ el.remove(); return; }
  el.textContent = valor;
}

function montarSubtitulo(md){
  const el = document.getElementById('hero-subtitulo');
  if (!md){ el.remove(); return; }
  el.innerHTML = formatarTexto(md);
}

function montarFotos(fotosConfig){
  const fotos = (fotosConfig || []).filter(f => f && f.imagem);
  if (!fotos.length) return;
  document.getElementById('secao-fotos').hidden = false;
  const fita = document.getElementById('fita-fotos');
  fotos.forEach(f => {
    const div = document.createElement('div');
    div.className = 'foto-item';
    div.innerHTML = `<img src="${f.imagem}" alt="">` + (f.legenda ? `<p class="foto-legenda">${escapeHtml(f.legenda)}</p>` : '');
    fita.appendChild(div);
  });
}

function montarMaisAcessados(projetos, cliques, status){
  const comCliques = projetos
    .filter(p => (cliques[p.slug] || 0) > 0)
    .sort((a,b) => (cliques[b.slug]||0) - (cliques[a.slug]||0))
    .slice(0, 8);
  if (!comCliques.length) return;
  document.getElementById('secao-acessados').hidden = false;
  const fita = document.getElementById('fita-acessados');
  comCliques.forEach(p => fita.appendChild(criarAppCard(p, status, { badge: cliques[p.slug] })));
}

function montarLancamentos(projetos, status){
  const recentes = projetos.slice().sort((a,b) => (b.dataPublicacao||'').localeCompare(a.dataPublicacao||'')).slice(0, 8);
  if (!recentes.length) return;
  document.getElementById('secao-lancamentos').hidden = false;
  const fita = document.getElementById('fita-lancamentos');
  recentes.forEach(p => fita.appendChild(criarAppCard(p, status, {})));
}

iniciar();
</script>
</body>
</html>
