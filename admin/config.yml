backend:
  name: git-gateway
  branch: main

publish_mode: simple
media_folder: "content/uploads"
public_folder: "/content/uploads"
locale: "pt"

collections:
  - name: "projetos"
    label: "Projetos"
    description: "Todos os jogos e apps publicados no portfólio"
    files:
      - file: "content/projetos.json"
        label: "Lista de projetos"
        name: "projetos"
        fields:
          - label: "Projetos"
            name: "projetos"
            widget: "list"
            label_singular: "Projeto"
            summary: "{{titulo}} — {{categoria}} · {{serie}}"
            fields:
              - label: "Título do projeto"
                name: "titulo"
                widget: "string"
                hint: "Só o nome do projeto — curto. Ex: 'Corrida espacial'. Texto mais longo vai no campo Descrição."
              - label: "Slug (usado no link do projeto)"
                name: "slug"
                widget: "string"
                hint: "Sem espaços, sem acentos, sem maiúsculas. Ex: corrida-espacial. Vira o link seusite.com/projetos/corrida-espacial"
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Use só letras minúsculas, números e hífens, sem espaços ou acentos"]
              - label: "Categoria"
                name: "categoria"
                widget: "select"
                options: ["Jogos", "App"]
              - label: "Descrição"
                name: "descricao"
                widget: "text"
                required: false
                hint: "Pode usar **negrito**, *itálico* e [texto do link](https://...)"
              - label: "Ano letivo"
                name: "ano"
                widget: "select"
                default: "2026"
                options: ["2026", "2027", "2028", "2029", "2030", "2031", "2032"]
              - label: "Segmento"
                name: "segmento"
                widget: "select"
                options: ["Ensino Fundamental", "Ensino Médio", "Não se aplica"]
              - label: "Ano escolar"
                name: "serie"
                widget: "select"
                options: ["8º ano", "9º ano", "1ª série", "2ª série", "3ª série", "Não se aplica"]
              - label: "Data de publicação"
                name: "dataPublicacao"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "DD/MM/YYYY"
                time_format: false
                required: false
                hint: "Usada para ordenar os 'Lançamentos recentes'"
              - label: "Imagem de capa"
                name: "imagem"
                widget: "image"
                required: false
              - label: "Fotos adicionais (galeria do projeto)"
                name: "galeria"
                widget: "list"
                required: false
                field: { label: "Foto", name: "foto", widget: "image" }
              - label: "Link do projeto"
                name: "link"
                widget: "string"
                required: false
                hint: "URL completa do site/app do aluno (ex: https://meuprojetoaluno.netlify.app)"
              - label: "Alunos / turma"
                name: "alunos"
                widget: "string"
                required: false
                hint: "Ex.: Turma 8ºA — ou nomes, conforme sua avaliação de cada caso"

  - name: "config"
    label: "Configurações do site"
    files:
      - file: "content/config.json"
        label: "Textos, aparência e carrossel geral"
        name: "config"
        fields:
          - label: "Aparência do site"
            name: "tema"
            widget: "select"
            default: "indigo"
            options:
              - { label: "Índigo (padrão — claro, roxo e verde-água)", value: "indigo" }
              - { label: "Aurora (claro, tons quentes de laranja)", value: "aurora" }
              - { label: "Terminal (escuro, estilo código)", value: "terminal" }
          - label: "Texto pequeno acima do título (hero)"
            name: "heroEyebrow"
            widget: "string"
            required: false
          - label: "Título principal (hero)"
            name: "heroTitulo"
            widget: "string"
            hint: "Uma frase curta e chamativa. Ex: 'Jogos e apps criados pelos nossos alunos'. NÃO use este campo para um texto de apresentação longo — use o campo Subtítulo abaixo."
          - label: "Subtítulo / texto de apresentação (hero)"
            name: "heroSubtitulo"
            widget: "text"
            required: false
            hint: "Aqui pode escrever um texto mais longo, de apresentação do site. Pode usar **negrito**, *itálico* e [texto do link](https://...). Para separar em parágrafos, deixe uma linha em branco entre eles."
          - { label: "Título da seção de fotos gerais", name: "tituloCarrosselFotos", widget: "string", default: "Bastidores da turma" }
          - { label: "Título da seção 'mais acessados'", name: "tituloMaisAcessados", widget: "string", default: "Mais acessados" }
          - { label: "Título da seção 'lançamentos'", name: "tituloLancamentos", widget: "string", default: "Lançamentos recentes" }
          - { label: "Título do catálogo completo", name: "tituloCatalogo", widget: "string", default: "Catálogo completo" }
          - label: "Fotos gerais (bastidores da turma, sem identificar alunos)"
            name: "carrosselFotos"
            widget: "list"
            required: false
            fields:
              - { label: "Foto", name: "imagem", widget: "image" }
              - { label: "Legenda", name: "legenda", widget: "string", required: false }
